
services:
  mongo:
    image: mongo:6.0
    container_name: complytics-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: complytics-backend
    env_file:
      - "Complytics Backend/.env"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_NAME=complytics
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: complytics-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:

